<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect x="0" y="0" width="200" height="200" rx="20" fill="#000000"/>
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- the bus: schema flows left-to-right through the reading eye -->
    <path d="M 57 100 L 76 100" stroke-width="8"/>
    <path d="M 124 100 L 130 100" stroke-width="8"/>
    <!-- Zod's brace: the input, cradling the flow toward the reader -->
    <path d="M 56 58 C 46 58 46 68 46 80 C 46 90 40 90 34 100 C 40 110 46 110 46 120 C 46 132 46 142 56 142" stroke-width="9"/>
    <!-- the reading eye: Kelex, the reader -->
    <circle cx="100" cy="100" r="23" stroke-width="9"/>
    <!-- emitted field-rows: the form out -->
    <rect x="130" y="70" width="42" height="15" rx="7.5" stroke-width="8"/>
    <rect x="130" y="92.5" width="42" height="15" rx="7.5" stroke-width="8"/>
    <rect x="130" y="115" width="42" height="15" rx="7.5" stroke-width="8"/>
  </g>
  <circle cx="100" cy="100" r="7" fill="#ffffff"/>
</svg>
